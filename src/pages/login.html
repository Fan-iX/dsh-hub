<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>{{style}}</style>
</head>
<body>
  <main class="card">
    <header class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <path d="M12 2.4l2.5 6.3 6.3 2.5-6.3 2.5L12 20l-2.5-6.3L3.2 11.2l6.3-2.5L12 2.4z" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>{{brand}}</h1>
        <p class="sub">{{subtitle}}</p>
      </div>
    </header>
    <form method="post" action="/hub/login">
      <label for="u">{{username}}</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
      <label for="p">{{password}}</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="err" role="alert">{{message}}</div>
      <button type="submit">{{submit}}</button>
    </form>
    <nav class="lang" aria-label="{{langLabel}}">{{langSwitch}}</nav>
  </main>
</body>
</html>
